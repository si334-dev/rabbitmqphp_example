<VirtualHost 100.106.23.12:443>

	ServerAdmin webmaster@localhost
	ServerName www.sample.com
	DocumentRoot /var/www/frontend

	SSLEngine on
	SSLCertificateFile /etc/apache2/ssl/f1.crt
	SSLCertificateKeyFile /etc/apache2/ssl/f1.key
	
	Header always set Strict-Transport-Security "max-age=31536000"

	ErrorLog ${APACHE_LOG_DIR}/sample_error.log
	CustomLog ${APACHE_LOG_DIR}/sample_access.log combined
</VirtualHost>
